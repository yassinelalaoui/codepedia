name: Release

# Builds the standalone codepedia binary on a real Windows runner and
# publishes a GitHub Release (specs/020-cli-packaging).
#
# PyInstaller does not cross-compile, so each OS's binary must be built on
# that OS - this workflow's build matrix is what makes a single-command
# `packaging/build.py` maintainer flow unnecessary. It exists specifically
# because building locally was found to be blocked on this project's own
# dev machine (see research.md section 8 and packaging/README.md's
# troubleshooting note) - GitHub-hosted runners sidestep that entirely.
#
# Only Windows is built for now: the macos-13/ubuntu-latest legs of this
# matrix repeatedly failed (PyInstaller could not be fetched on those
# runners at the time), and rather than carry a permanently-red job, macOS
# and Linux packaging has been deferred - see the "Perspectives
# d'Évolution" section of docs/pfa.tex. Re-adding an `os: macos-latest` /
# `os: ubuntu-latest` matrix entry (mirroring the windows-latest one
# below) is the way to bring them back once that's revisited.
#
# Publishing still requires a maintainer to deliberately push a version
# tag (vX.Y.Z); nothing runs on ordinary commits.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_os: windows
            binary_name: codepedia.exe
            asset_suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build binary
        run: python packaging/build.py

      - name: Read project version
        id: version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename asset per release-asset naming contract
        shell: bash
        run: |
          mkdir -p release-assets
          cp "dist/${{ matrix.binary_name }}" \
             "release-assets/codepedia-${{ steps.version.outputs.version }}-${{ matrix.asset_os }}-x86_64${{ matrix.asset_suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset_os }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cp packaging/install.sh release-assets/install.sh
          cp packaging/install.ps1 release-assets/install.ps1
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
