[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scanner"
version = "0.1.0"
description = "Local repository scanner for code inventory and language detection"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pathspec>=0.12",
  "networkx>=3.3",
  "tree-sitter>=0.24",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "Jinja2>=3.1",
  "Markdown>=3.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "watchdog>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
repo-scanner = "cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_generator = ["templates/*.jinja", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
