[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codepedia"
version = "0.1.1"
description = "Local repository scanner for code inventory and language detection"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pathspec>=0.12",
  # Vector search holds embeddings as one float32 matrix per dimensionality and
  # scores a query with a single matrix-vector product. The pure-Python cosine
  # loop it replaces measured 19.4s and 2.3GB at 50k chunks of 1536 dimensions;
  # no dependency-free alternative fixes the latency (pre-normalizing to a plain
  # dot product was measured at only 2.5x). The matrix is the *only* copy: an
  # index loads its entries without vectors, so the memory claim above is the
  # memory actually used rather than the matrix on top of the Python floats.
  "numpy>=1.26",
  # 0.26.0 segfaults when a Node's point is read after its children are
  # walked (crashes on any file of a few thousand nodes), so cap below it.
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "Jinja2>=3.1",
  "Markdown>=3.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "watchdog>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
build = ["pyinstaller>=6.0"]

[project.scripts]
codepedia = "cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_generator = ["templates/*.jinja", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
